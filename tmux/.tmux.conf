set -s default-terminal "tmux-256color"
set -g default-terminal "tmux-256color"
set -sg escape-time 10
set -g mouse on
set -g history-limit 100000

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'

# Beginner-friendly pane and window controls.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-panes-time 2000
set -g display-time 4000
set -g set-clipboard on
set -g focus-events on

# Konsole custom key sequences (no prefix required).
set -s user-keys[0] "\e[9001~"
set -s user-keys[1] "\e[9002~"
bind -n User0 split-window -h -c "#{pane_current_path}"
bind -n User1 split-window -v -c "#{pane_current_path}"

# Portable alternatives: Ctrl+B, release, then the indicated key.
bind - split-window -h -c "#{pane_current_path}"
bind + split-window -v -c "#{pane_current_path}"
bind = split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message 'Configuration reloaded'
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
bind -r C-Left resize-pane -L 5
bind -r C-Right resize-pane -R 5
bind -r C-Up resize-pane -U 5
bind -r C-Down resize-pane -D 5

set -g status-style 'bg=colour236,fg=colour252'
set -g status-left ' #S | '
set -g status-right-length 100
set -g status-right ' Alt+arrows: move | Ctrl+b then ?: help '
setw -g window-status-current-style 'bg=blue,fg=white,bold'
